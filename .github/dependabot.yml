version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem keeps the go directive guard meaningful: if a bump raises the
      # required Go version, TestGoDirectiveMatchesTheBuildImage fails that single PR rather
      # than an unrelated one.
      docker:
        patterns: ["github.com/docker/*", "github.com/containerd/*", "github.com/opencontainers/*"]
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      golang-x:
        patterns: ["golang.org/x/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
