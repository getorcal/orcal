name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the golangci-lint used locally; the config in .golangci.yml is v2 schema.
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        # Pinned and module-independent, mirroring how oapi-codegen is pinned in generate.go.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - run: make lint
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generated code is current
        run: make verify-generate
      - name: Module graph is unchanged by building
        # Deliberately never runs `go mod tidy`: four dependencies hold the go directive floor
        # and tidy silently raises it. This only asserts nothing drifted.
        run: |
          go mod verify
          go build ./...
          git diff --exit-code go.mod go.sum

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: docker version
      - name: Docker integration suite
        # These tests t.Skipf when no daemon is reachable, which would let this job pass green
        # without exercising the runtime at all. Fail loudly instead of skipping silently.
        run: |
          set -o pipefail
          go test -tags docker ./test/integration/... -count=1 -timeout 25m -v 2>&1 | tee integration.log
          if grep -q "no Docker daemon available" integration.log; then
            echo "::error::integration tests skipped - the runtime was never exercised"
            exit 1
          fi
          if ! grep -q -- "--- PASS" integration.log; then
            echo "::error::no integration test reported a pass"
            exit 1
          fi
      - name: No leaked containers or networks
        if: always()
        run: |
          leaked=$(docker ps -aq --filter "label=orcal.managed" | wc -l | tr -d ' ')
          if [ "$leaked" != "0" ]; then
            echo "::error::$leaked orcal container(s) left behind"; docker ps -a --filter "label=orcal.managed"; exit 1
          fi

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: orcal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Both binaries are present and runnable
        run: |
          docker run --rm --entrypoint /bin/sh orcal:ci -c '
            set -e
            test -x /usr/local/bin/orcald
            test -x /usr/local/bin/orcal
            /usr/local/bin/orcald --help >/dev/null 2>&1 || true
          '

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        # Intentionally unpinned: a vulnerability scanner is only useful at its newest.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
