name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Newest patch of the 1.25 series, matching what golang:1.25-alpine resolves to for releases.
  # Deliberately NOT go-version-file: go.mod - that installs exactly 1.25.0, the floor we
  # promise consumers, which is many security patches behind.
  GO_VERSION: "1.25.x"
  # Must match the golangci-lint used locally; .golangci.yml uses the v2 schema.
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Runners pre-cache a Go patch that can lag the newest release (1.25.12 vs
          # 1.25.13), which is enough to fail the vuln gate on already-fixed advisories.
          check-latest: true
          cache: true
      - name: Install golangci-lint
        # Pinned and module-independent, mirroring how oapi-codegen is pinned in generate.go.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - run: make lint
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Runners pre-cache a Go patch that can lag the newest release (1.25.12 vs
          # 1.25.13), which is enough to fail the vuln gate on already-fixed advisories.
          check-latest: true
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the SDK
        run: cd sdk/python && pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Install the TypeScript SDK
        run: cd sdk/typescript && npm ci
      - name: Generated code is current
        run: make verify-generate
      - name: TypeScript SDK types check
        run: cd sdk/typescript && npm run typecheck
      - name: Module graph is unchanged by building
        # Deliberately never runs `go mod tidy`: dependencies hold the go directive floor and
        # tidy silently raises it. This only asserts nothing drifted.
        run: |
          go mod verify
          go build ./...
          git diff --exit-code go.mod go.sum

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor go.mod promises. If this fails, the declared minimum is a lie.
          - { os: ubuntu-latest, go: "1.25.0" }
          - { os: ubuntu-latest, go: "1.25.x" }
          - { os: macos-latest, go: "1.25.x" }
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, go${{ matrix.go }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # Runners pre-cache a Go patch that can lag the newest release (1.25.12 vs
          # 1.25.13), which is enough to fail the vuln gate on already-fixed advisories.
          check-latest: true
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Runners pre-cache a Go patch that can lag the newest release (1.25.12 vs
          # 1.25.13), which is enough to fail the vuln gate on already-fixed advisories.
          check-latest: true
          cache: true
      - run: docker version
      - name: Docker integration suite
        # These tests t.Skipf when no daemon is reachable, which would let this job pass green
        # without exercising the runtime at all. Fail loudly instead of skipping silently.
        run: |
          set -o pipefail
          go test -tags docker ./test/integration/... -count=1 -timeout 25m -v 2>&1 | tee integration.log
          if grep -q "no Docker daemon available" integration.log; then
            echo "::error::integration tests skipped - the runtime was never exercised"
            exit 1
          fi
          if ! grep -q -- "--- PASS" integration.log; then
            echo "::error::no integration test reported a pass"
            exit 1
          fi
      - name: No leaked containers
        if: always()
        run: |
          leaked=$(docker ps -aq --filter "label=orcal.managed" | wc -l | tr -d ' ')
          if [ "$leaked" != "0" ]; then
            echo "::error::$leaked orcal container(s) left behind"
            docker ps -a --filter "label=orcal.managed"
            exit 1
          fi

  gvisor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install

          # orcald refuses to start against a runsc without these; see docs/SECURITY.md.
          # --overlay2=none: gVisor's default self-backed root overlay discards writes before
          # ContainerCommit can see them, so snapshots would silently lose all data.
          # --network=host: gVisor's default netstack gets no route on orcal's isolated bridge
          # network, so sandboxes would have no network.
          sudo jq '.runtimes.runsc.runtimeArgs = ["--overlay2=none", "--network=host"]' /etc/docker/daemon.json \
            | sudo tee /etc/docker/daemon.json.tmp > /dev/null
          sudo mv /etc/docker/daemon.json.tmp /etc/docker/daemon.json

          sudo systemctl restart docker
          docker info --format '{{.Runtimes}}'

          args=$(docker info --format '{{json .Runtimes}}' | jq -r '.runsc.runtimeArgs // [] | join(",")')
          echo "runsc runtimeArgs: $args"
          case ",$args," in
            *,--overlay2=none,*) ;;
            *) echo "::error::daemon.json edit did not take effect: runsc is missing --overlay2=none"; exit 1 ;;
          esac
          case ",$args," in
            *,--network=host,*) ;;
            *) echo "::error::daemon.json edit did not take effect: runsc is missing --network=host"; exit 1 ;;
          esac
      - name: gVisor suite
        env:
          ORCAL_CONTAINER_RUNTIME: runsc
        run: |
          set -o pipefail
          go test -tags gvisor ./test/integration/... -count=1 -timeout 25m -v 2>&1 | tee gvisor.log
          if grep -q "no Docker daemon available" gvisor.log; then
            echo "::error::gvisor tests skipped - the runtime was never exercised"; exit 1
          fi
          if ! grep -q -- "--- PASS" gvisor.log; then
            echo "::error::no gvisor test reported a pass"; exit 1
          fi
      - name: No leaked containers
        if: always()
        run: |
          leaked=$(docker ps -aq --filter "label=orcal.managed" | wc -l | tr -d ' ')
          if [ "$leaked" != "0" ]; then
            echo "::error::$leaked orcal container(s) left behind"; exit 1
          fi

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: orcal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Both binaries are present and runnable
        run: |
          docker run --rm --entrypoint /bin/sh orcal:ci -c '
            set -e
            test -x /usr/local/bin/orcald
            test -x /usr/local/bin/orcal
          '

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Runners pre-cache a Go patch that can lag the newest release (1.25.12 vs
          # 1.25.13), which is enough to fail the vuln gate on already-fixed advisories.
          check-latest: true
          cache: true
      - name: govulncheck
        # Unpinned on purpose: a vulnerability scanner is only useful at its newest.
        # Only findings reachable from orcal's own code gate the build; imported-but-uncalled
        # ones do not. Accepted findings live in .github/vuln-allowlist.txt with reasons.
        run: |
          # Logged because which patch release ran is the first thing you need when a stdlib
          # advisory shows up here.
          go version
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -format json ./... > vuln.json || true

          jq -r 'select(has("finding")) | .finding | select((.trace // []) | length > 0) | select(.trace[0].function != null) | .osv' vuln.json | sort -u > called.txt
          jq -r 'select(has("finding")) | .finding | select((.trace // []) | length > 0) | select(.trace[0].function != null) | select((.fixed_version // "") != "") | .osv' vuln.json | sort -u > fixable.txt
          grep -vE '^[[:space:]]*(#|$)' .github/vuln-allowlist.txt | awk '{print $1}' | sort -u > accepted.txt

          comm -23 called.txt accepted.txt > unaccepted.txt
          comm -12 fixable.txt accepted.txt > stale.txt

          if [ -s stale.txt ]; then
            echo "::error::accepted vulnerabilities now have fixes - upgrade and drop them from .github/vuln-allowlist.txt:"
            sed 's#^#  https://pkg.go.dev/vuln/#' stale.txt
            exit 1
          fi
          if [ -s unaccepted.txt ]; then
            echo "::error::vulnerabilities reachable from orcal code:"
            sed 's#^#  https://pkg.go.dev/vuln/#' unaccepted.txt
            echo "Upgrade to fix, or accept with a written reason in .github/vuln-allowlist.txt"
            exit 1
          fi
          echo "No unaccepted reachable vulnerabilities."
          if [ -s accepted.txt ]; then
            echo "Consciously accepted:"; sed 's#^#  #' accepted.txt
          fi

  sdk-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the SDK
        run: cd sdk/python && pip install -e '.[dev]'
      - name: Generated models are current
        run: |
          make generate-python
          git diff --exit-code sdk/python/src/orcal/models.py
      - name: Unit suite
        run: cd sdk/python && python -m pytest -q --ignore=tests/test_live.py
      - name: Start orcald
        run: |
          make build
          ORCAL_DATA_DIR=/tmp/orcal-sdk ./bin/orcald > /tmp/orcald.log 2>&1 &
          for i in $(seq 1 30); do
            token=$(grep -o 'orcal_[A-Za-z0-9_-]*' /tmp/orcald.log | head -1) && [ -n "$token" ] && break
            sleep 1
          done
          [ -n "$token" ] || { echo "::error::orcald never printed a token"; cat /tmp/orcald.log; exit 1; }
          echo "ORCAL_TOKEN=$token" >> "$GITHUB_ENV"
          echo "ORCAL_URL=http://127.0.0.1:8080" >> "$GITHUB_ENV"
      - name: Live suite
        run: cd sdk/python && python -m pytest tests/test_live.py -q
      - name: No leaked containers
        if: always()
        run: |
          leaked=$(docker ps -aq --filter "label=orcal.managed" | wc -l | tr -d ' ')
          if [ "$leaked" != "0" ]; then
            echo "::error::$leaked orcal container(s) left behind"; docker ps -a --filter "label=orcal.managed"; exit 1
          fi

  sdk-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the SDK
        run: cd sdk/typescript && npm ci
      - name: Generated types are current
        run: |
          make generate-ts
          git diff --exit-code sdk/typescript/src/models.ts
      - name: Type check
        run: cd sdk/typescript && npm run typecheck
      - name: Unit suite
        run: cd sdk/typescript && npm run test:unit
      - name: Start orcald
        run: |
          make build
          ORCAL_DATA_DIR=/tmp/orcal-sdk-ts ./bin/orcald > /tmp/orcald.log 2>&1 &
          for i in $(seq 1 30); do
            token=$(grep -o 'orcal_[A-Za-z0-9_-]*' /tmp/orcald.log | head -1) && [ -n "$token" ] && break
            sleep 1
          done
          [ -n "$token" ] || { echo "::error::orcald never printed a token"; cat /tmp/orcald.log; exit 1; }
          echo "ORCAL_TOKEN=$token" >> "$GITHUB_ENV"
          echo "ORCAL_URL=http://127.0.0.1:8080" >> "$GITHUB_ENV"
      - name: Live suite
        run: cd sdk/typescript && npm test
      - name: No leaked containers
        if: always()
        run: |
          leaked=$(docker ps -aq --filter "label=orcal.managed" | wc -l | tr -d ' ')
          if [ "$leaked" != "0" ]; then
            echo "::error::$leaked orcal container(s) left behind"; docker ps -a --filter "label=orcal.managed"; exit 1
          fi
