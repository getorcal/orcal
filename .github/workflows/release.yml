name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Newest patch of the declared series, so shipped binaries carry current stdlib fixes.
  # The go.mod directive is the consumer floor, not what we build releases with.
  GO_VERSION: "1.25.x"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # Runners pre-cache a Go patch that can lag the newest release (1.25.12 vs
          # 1.25.13), which is enough to fail the vuln gate on already-fixed advisories.
          check-latest: true
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # Runners pre-cache a Go patch that can lag the newest release (1.25.12 vs
          # 1.25.13), which is enough to fail the vuln gate on already-fixed advisories.
          check-latest: true
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # modernc.org/sqlite is pure Go, so every target cross-compiles without a C toolchain.
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          dist="orcal_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${dist}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/${dist}/orcald" ./cmd/orcald
          go build -trimpath -ldflags "-s -w" -o "dist/${dist}/orcal" ./cmd/orcal
          cp LICENSE "dist/${dist}/"
          tar -C dist -czf "dist/${dist}.tar.gz" "${dist}"
      - uses: actions/upload-artifact@v7
        with:
          name: orcal_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt
      - name: Release notes from CHANGELOG.md
        # The release body is hand-written product copy, not commit subjects. Every failure
        # here is a missing edit to CHANGELOG.md, and failing is better than publishing a
        # release whose notes silently say nothing.
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## ${version}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${version}' heading for tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          markers=$(grep -c '<!-- release:start -->' CHANGELOG.md || true)
          if [ "$markers" != "1" ]; then
            echo "::error::expected exactly one <!-- release:start --> marker, found ${markers}; remove them from the previous entry"
            exit 1
          fi
          awk '/<!-- release:start -->/{flag=1;next} /<!-- release:end -->/{flag=0} flag' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::the marked block in CHANGELOG.md is empty"
            exit 1
          fi
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/checksums.txt

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
