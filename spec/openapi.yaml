openapi: 3.0.3
info:
  title: Orcal Sandbox API
  version: "1.0.0"
  description: The Open Sandbox Standard reference API.
servers:
  - url: /v1
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is live
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
  /version:
    get:
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Build and protocol version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
  /sandboxes:
    get:
      operationId: listSandboxes
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: label, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
      responses:
        "200":
          description: A page of sandboxes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSandboxRequest" }
      responses:
        "201":
          description: Sandbox created and running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sandboxes/{ref}:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSandbox
      responses:
        "200":
          description: The sandbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: destroySandbox
      responses:
        "200":
          description: The destroyed sandbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /sandboxes/{ref}/start:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    post:
      operationId: startSandbox
      responses:
        "200":
          description: The started sandbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /sandboxes/{ref}/stop:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    post:
      operationId: stopSandbox
      responses:
        "200":
          description: The stopped sandbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /sandboxes/{ref}/execs:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    get:
      operationId: listExecs
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of execs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createExec
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExecRequest" }
      responses:
        "201":
          description: Exec started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exec" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /execs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getExec
      responses:
        "200":
          description: The exec
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exec" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /execs/{id}/output:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: from, in: query, schema: { type: integer, format: int64, minimum: 0 } }
    get:
      operationId: getExecOutput
      responses:
        "200":
          description: Server-sent event stream of output frames
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /sandboxes/{ref}/snapshots:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    get:
      operationId: listSandboxSnapshots
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSnapshot
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSnapshotRequest" }
      responses:
        "201":
          description: Snapshot created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sandboxes/{ref}/restore:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    post:
      operationId: restoreSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
      responses:
        "200":
          description: The restored sandbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /snapshots:
    get:
      operationId: listSnapshots
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: sandbox, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /sandboxes/{ref}/files:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
      - { name: path, in: query, required: true, schema: { type: string } }
    get:
      operationId: getFile
      responses:
        "200":
          description: File contents
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    put:
      operationId: putFile
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: File written
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sandboxes/{ref}/files/stat:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
      - { name: path, in: query, required: true, schema: { type: string } }
    get:
      operationId: statFile
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sandboxes/{ref}/files/list:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
      - { name: path, in: query, required: true, schema: { type: string } }
    get:
      operationId: listFiles
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sandboxes/{ref}/archive:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
      - { name: path, in: query, required: true, schema: { type: string } }
    get:
      operationId: getArchive
      responses:
        "200":
          description: Tar archive of the path
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    put:
      operationId: putArchive
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Archive extracted
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /snapshots/{ref}:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSnapshot
      responses:
        "200":
          description: The snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSnapshot
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /tokens:
    get:
      operationId: listTokens
      responses:
        "200":
          description: Every token, including revoked ones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTokenRequest" }
      responses:
        "201":
          description: Token created; the plaintext is returned exactly once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedToken" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeToken
      responses:
        "204":
          description: Revoked
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Version:
      type: object
      required: [version, api_versions]
      properties:
        version: { type: string }
        api_versions:
          type: array
          items: { type: string }
    Resources:
      type: object
      required: [cpu_millis, memory_bytes, pids_limit]
      properties:
        cpu_millis: { type: integer, minimum: 1 }
        memory_bytes: { type: integer, format: int64, minimum: 1 }
        pids_limit: { type: integer, minimum: 1 }
    Sandbox:
      type: object
      required: [id, image, state, runtime, resources, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        state:
          type: string
          enum: [creating, running, stopped, destroying, destroyed, error]
        runtime: { type: string }
        resources: { $ref: "#/components/schemas/Resources" }
        env:
          type: object
          additionalProperties: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        parent_snapshot_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SandboxList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Sandbox" }
        next_cursor: { type: string }
    CreateSandboxRequest:
      type: object
      description: Exactly one of image or snapshot must be supplied
      properties:
        name: { type: string }
        image: { type: string }
        snapshot: { type: string }
        cpu_millis: { type: integer, minimum: 1 }
        memory_bytes: { type: integer, format: int64, minimum: 1 }
        pids_limit: { type: integer, minimum: 1 }
        env:
          type: object
          additionalProperties: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    CreateExecRequest:
      type: object
      required: [command]
      properties:
        command:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        working_dir: { type: string }
        user: { type: string }
    Exec:
      type: object
      required: [id, sandbox_id, command, state, output_bytes, truncated, started_at]
      properties:
        id: { type: string }
        sandbox_id: { type: string }
        command:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        working_dir: { type: string }
        user: { type: string }
        state:
          type: string
          enum: [running, exited, failed]
        exit_code: { type: integer, nullable: true }
        output_bytes: { type: integer, format: int64 }
        truncated: { type: boolean }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    ExecList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Exec" }
        next_cursor: { type: string }
    Snapshot:
      type: object
      required: [id, sandbox_id, runtime_ref, image, size_bytes, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        sandbox_id: { type: string }
        parent_id: { type: string, nullable: true }
        runtime_ref: { type: string }
        image: { type: string }
        size_bytes:
          type: integer
          format: int64
          description: Apparent image size including shared layers, not incremental disk use
        created_at: { type: string, format: date-time }
    SnapshotList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Snapshot" }
        next_cursor: { type: string }
    CreateSnapshotRequest:
      type: object
      properties:
        name: { type: string }
    RestoreRequest:
      type: object
      required: [snapshot]
      properties:
        snapshot: { type: string }
    FileInfo:
      type: object
      required: [name, size, mode, mtime, is_dir]
      properties:
        name: { type: string }
        size: { type: integer, format: int64 }
        mode: { type: string, description: "Octal permission string, e.g. 0644" }
        mtime: { type: string, format: date-time }
        is_dir: { type: boolean }
        link_target: { type: string }
    FileList:
      type: object
      required: [items, truncated]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FileInfo" }
        truncated:
          type: boolean
          description: True when the listing hit a configured cap and is incomplete
    Scope:
      type: string
      enum:
        - "sandboxes:read"
        - "sandboxes:write"
        - "exec"
        - "files:read"
        - "files:write"
        - "snapshots:read"
        - "snapshots:write"
        - "audit:read"
        - "admin"
        - "*"
    Token:
      type: object
      required: [id, name, prefix, scopes, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
    TokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Token" }
    CreateTokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Scope" }
        expires_in_seconds: { type: integer, format: int64, minimum: 1 }
    CreatedToken:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The plaintext, returned only here and never again
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - forbidden
            - token_not_found
            - sandbox_not_found
            - snapshot_not_found
            - exec_not_found
            - name_taken
            - invalid_state
            - resource_exhausted
            - runtime_unavailable
            - internal_error
            - path_not_found
        message: { type: string }
        details:
          type: object
          additionalProperties: true
security:
  - bearerAuth: []
