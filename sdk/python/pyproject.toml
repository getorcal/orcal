[project]
name = "orcal"
version = "0.1.0"
description = "Client for Orcal, self-hosted sandbox infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "datamodel-code-generator>=0.25", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orcal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
